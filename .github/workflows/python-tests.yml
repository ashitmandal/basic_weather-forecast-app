```yaml
name: Python Application CI

on:
  # Run CI whenever code is pushed to any branch
  push:
    branches:
      - '**'

  # Validate pull requests targeting main
  pull_request:
    branches:
      - main

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pytest - Python 3.11
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Configure Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Step 3: Verify Python installation
      - name: Verify Python
        run: |
          python --version
          python -m pip --version

      # Step 4: Create isolated virtual environment
      - name: Create virtual environment
        run: |
          python -m venv .venv

      # Step 5: Install project dependencies
      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      # Step 6: Run automated tests
      - name: Run Pytest
        run: |
          .venv/bin/python -m pytest -v -s --junitxml=test-results.xml

      # Step 7: Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore
```

